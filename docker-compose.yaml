services:
  openclaw-gateway:
    build:
      context: .
    image: openclaw-custom
    container_name: openclaw-gateway
    environment:
      HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      CHROME_BIN: /usr/local/bin/chromium-docker
      CHROMIUM_FLAGS: "--no-sandbox --disable-gpu --disable-dev-shm-usage"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      XDG_CACHE_HOME: /home/node/.cache
    volumes:
      - ${OPENCLAW_CONFIG_DIR:-./data/config}:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR:-./data/workspace}:/home/node/.openclaw/workspace
      - ./data/claude-cli:/home/node/.claude
      - ./data/gemini-cli:/home/node/.gemini
      - ./data/github-cli:/home/node/.config/gh
      - ./data/gitconfig:/home/node/.gitconfig
    shm_size: '2gb'
    ports:
      - "18789:18789"   # Gateway API
      - "18790:18790"   # Dashboard UI
    init: true
    restart: unless-stopped
    read_only: false
    tmpfs:
      - /tmp:size=1g
      - /home/node/.openclaw/browser:size=512m
      - /home/node/.cache:size=2g
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 4g
    cpus: 2.0
    pids_limit: 256
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:18789/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    networks:
      - openclaw-net
    command:
      [
        "node",
        "dist/index.js",
        "gateway",
        "--port",
        "18789",
      ]

  openclaw-cli:
    build: .
    image: openclaw-custom
    container_name: openclaw-cli
    environment:
      HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      BROWSER: echo
      CHROME_BIN: /usr/local/bin/chromium-docker
    volumes:
      - ./data/config-cli:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR:-./data/workspace}:/home/node/.openclaw/workspace
    stdin_open: true
    tty: true
    init: true
    restart: "no"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /tmp:size=256m
    mem_limit: 2g
    cpus: 1.0
    pids_limit: 128
    entrypoint: ["node", "dist/index.js"]
    profiles:
      - cli
    network_mode: "service:openclaw-gateway"

networks:
  openclaw-net:
    driver: bridge
